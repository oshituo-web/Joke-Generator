<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="site">
        <h1>😂  Joke Generator  😂</h1>
        <p class="intro">
            Get a random joke from JokeAPI.
        </p>

        <section class="joke-card">

            <div class="filter-group">
                <label for="category">Category</label>

                <select id="category">

                    <option value="Any">Any</option>
                    <option value="Programming">Programming</option>
                    <option value="Misc">Misc</option>
                    <option value="Dark">Dark</option>
                    <option value="Pun">Pun</option>
                    <option value="Spooky">Spooky</option>
                    <option value="Christmas">Christmas</option>
                </select>
            </div>

            <div class="filter-group">

                <label for="type">Joke Type</label>
                
                <select id="type">

                    <option value="">Any</option>
                    <option value="single">Single</option>
                    <option value="twopart">Two Part</option>
                </select>

                <div class="safe-mode">
                    
                    <label>
                        <input type="checkbox" id="safe-mode" checked>
                        Safe Mode
                    </label>

                    <p> Hide inappropriate jokes</p>
                       
                </div>
            </div>

        
            <button id="jokeBtn">Get Joke</button>

            <div class="joke-result">

                <p id="joke">Choose your filters and get a joke.</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    
</body>
</html>
